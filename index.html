<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Score Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <header class="page-header">
        <h1>Cricket Score Tracker</h1>
        <p class="subtitle">Tap runs as they happen. Track two teams side by side.</p>
    </header>

    <div class="container">
        <div class="team">
            <h3>INDIA</h3>
            <h4 id="indScore">0/0</h4>
            <div class="btn-row">
                <button onclick="add1()">+1</button>
                <button onclick="add2()">+2</button>
                <button onclick="add3()">+3</button>
                <button onclick="add4()">+4</button>
            </div>
            <div class="btn-row">
                <button onclick="add6()">+6</button>
                <button class="btn-wicket" onclick="indWickets()">Wicket</button>
                <button class="btn-reset" onclick="indReset()">Reset</button>
            </div>
        </div>

        <div class="team">
            <h3>JAPAN</h3>
            <h4 id="japScore">0/0</h4>
            <div class="btn-row">
                <button onclick="japAdd1()">+1</button>
                <button onclick="japAdd2()">+2</button>
                <button onclick="japAdd3()">+3</button>
                <button onclick="japAdd4()">+4</button>
            </div>
            <div class="btn-row">
                <button onclick="japAdd6()">+6</button>
                <button class="btn-wicket" onclick="japWickets()">Wicket</button>
                <button class="btn-reset" onclick="japReset()">Reset</button>
            </div>
        </div>
    </div>

    <footer class="page-footer">
        <p>Built with vanilla HTML, CSS and JavaScript &mdash; no frameworks.</p>
    </footer>

    <script src="index.js"></script>
</body>
</html>
